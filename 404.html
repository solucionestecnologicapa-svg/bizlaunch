<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada — BizLaunch</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050A14">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#050A14;--card:#101A2D;--acc:#00F5C8;--txt:#E8EDF5;--mut:#8C9BBA;--bdr:rgba(140,155,186,.24)}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 15%,rgba(124,92,252,.22),transparent 55%),radial-gradient(circle at 80% 85%,rgba(0,245,200,.16),transparent 55%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{max-width:460px}
.n{font-size:clamp(5rem,22vw,8rem);font-weight:900;line-height:1;letter-spacing:-.04em;background:linear-gradient(90deg,var(--acc),#7C5CFC);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:1.5rem;margin:14px 0 8px}
p{color:var(--mut);line-height:1.6}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
a{display:inline-flex;align-items:center;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .15s}
a:hover{transform:translateY(-1px)}
.pri{background:var(--acc);color:#04121A}
.gh{border:1px solid var(--bdr);color:var(--txt)}
a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="n">404</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el negocio haya cambiado su enlace o que la dirección esté mal escrita.</p>
  <div class="row">
    <a class="pri" href="/#directorio">Buscar negocios</a>
    <a class="gh" href="/">Ir al inicio</a>
  </div>
</main>
</body>
</html>
